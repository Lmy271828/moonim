name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version

      - name: Check (all targets)
        run: moon check --target all

      - name: Test
        run: moon test

      - name: Build (all targets)
        run: moon build --target all

      - name: "Run example: morph"
        run: moon run examples/morph | tee morph_frames.txt && grep -q "<svg" morph_frames.txt

      - name: "Run example: formula"
        run: moon run examples/formula | tee formula.svg.txt && grep -q "<svg" formula.svg.txt

      - name: "Run example: texmorph"
        run: moon run examples/texmorph | tee texmorph_frames.txt && grep -q "<svg" texmorph_frames.txt
